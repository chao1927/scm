spring:
  config:
    import:
      - "optional:nacos:scm-common-prod.yaml?group=${NACOS_GROUP:@nacos.group@}&refreshEnabled=true"
      - "optional:nacos:${spring.application.name}-prod.yaml?group=${NACOS_GROUP:@nacos.group@}&refreshEnabled=true"
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://mysql:3306/scm_purchase?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:scm_app}
    password: ${MYSQL_PASSWORD:change-me}
    hikari:
      maximum-pool-size: ${MYSQL_MAX_POOL_SIZE:20}
      minimum-idle: ${MYSQL_MIN_IDLE:4}
      connection-timeout: ${MYSQL_CONNECTION_TIMEOUT_MS:3000}

scm:
  rocketmq:
    enabled: ${ROCKETMQ_ENABLED:true}
    endpoints: ${ROCKETMQ_ENDPOINTS:rocketmq:8081}
    purchase-topic: ${ROCKETMQ_PURCHASE_TOPIC:purchase-domain-event}
    external-consumer:
      topics: ${ROCKETMQ_PURCHASE_EXTERNAL_TOPICS:supplier-domain-event,wms-domain-event,tms-domain-event,bms-domain-event}
      group: ${ROCKETMQ_PURCHASE_CONSUMER_GROUP:purchase-business-event-consumer}
      threads: ${ROCKETMQ_PURCHASE_CONSUMER_THREADS:4}
