spring:
  application:
    name: mdm-service
  profiles:
    active: @spring.profiles.active@
  cloud:
    nacos:
      username: ${NACOS_USERNAME:@nacos.username@}
      password: ${NACOS_PASSWORD:@nacos.password@}
      config:
        server-addr: ${NACOS_SERVER_ADDR:@nacos.server-addr@}
        namespace: ${NACOS_NAMESPACE:@nacos.namespace@}
        group: ${NACOS_GROUP:@nacos.group@}
  jackson:
    time-zone: Asia/Shanghai
mybatis:
  configuration:
    map-underscore-to-camel-case: true
server:
  port: ${SERVER_PORT:8098}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
scm:
  mdm:
    file-storage:
      type: ${MDM_FILE_STORAGE_TYPE:local}
      local:
        root: ${MDM_FILE_STORAGE_LOCAL_ROOT:./data/mdm-files}
    file-task:
      batch-size: ${MDM_FILE_TASK_BATCH_SIZE:10}
      fixed-delay: ${MDM_FILE_TASK_FIXED_DELAY_MS:2000}
      retry-delay-seconds: ${MDM_FILE_TASK_RETRY_DELAY_SECONDS:60}
      max-retries: ${MDM_FILE_TASK_MAX_RETRIES:8}
      export-max-rows: ${MDM_EXPORT_MAX_ROWS:10000}
      max-upload-bytes: ${MDM_MAX_UPLOAD_BYTES:10485760}
  security:
    active-kid: ${IAM_JWT_ACTIVE_KID:active}
    hmac-secret: ${IAM_JWT_SECRET:}
    previous-kid: ${IAM_JWT_PREVIOUS_KID:}
    previous-hmac-secret: ${IAM_JWT_PREVIOUS_SECRET:}
    previous-valid-until-epoch-second: ${IAM_JWT_PREVIOUS_VALID_UNTIL_EPOCH_SECOND:0}
    permission-namespace: mdm
  rocketmq:
    endpoints: ${SCM_ROCKETMQ_ENDPOINTS:localhost:8081}
    mdm-producer:
      default-topic: ${MDM_ROCKETMQ_DEFAULT_TOPIC:mdm-domain-event}
      topics: ${MDM_ROCKETMQ_PRODUCER_TOPICS:mdm-domain-event}
    mdm-consumer:
      topics: ${MDM_ROCKETMQ_CONSUMER_TOPICS:supplier-domain-event,tms-domain-event,mdm-publication-receipt}
      group: ${MDM_ROCKETMQ_CONSUMER_GROUP:mdm-business-event-consumer}
  outbox:
    batch-size: ${MDM_OUTBOX_BATCH_SIZE:100}
    fixed-delay: ${MDM_OUTBOX_FIXED_DELAY_MS:1000}
    max-retries: ${MDM_OUTBOX_MAX_RETRIES:16}
