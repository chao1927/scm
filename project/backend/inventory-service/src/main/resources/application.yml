spring:
  application:
    name: inventory-service
  profiles:
    active: @spring.profiles.active@
  cloud:
    nacos:
      username: ${NACOS_USERNAME:@nacos.username@}
      password: ${NACOS_PASSWORD:@nacos.password@}
      config:
        server-addr: ${NACOS_SERVER_ADDR:@nacos.server-addr@}
        namespace: ${NACOS_NAMESPACE:@nacos.namespace@}
        group: ${NACOS_GROUP:@nacos.group@}
mybatis:
  configuration:
    map-underscore-to-camel-case: true

server:
  port: ${SERVER_PORT:8104}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

scm:
  security:
    active-kid: ${IAM_JWT_ACTIVE_KID:active}
    hmac-secret: ${IAM_JWT_SECRET:}
    previous-kid: ${IAM_JWT_PREVIOUS_KID:}
    previous-hmac-secret: ${IAM_JWT_PREVIOUS_SECRET:}
    previous-valid-until-epoch-second: ${IAM_JWT_PREVIOUS_VALID_UNTIL_EPOCH_SECOND:0}
    permission-namespace: inventory
  rocketmq:
    endpoints: ${SCM_ROCKETMQ_ENDPOINTS:127.0.0.1:8081}
    inventory-topic: ${ROCKETMQ_INVENTORY_TOPIC:inventory-domain-event}
    inbound-topics: ${ROCKETMQ_INVENTORY_INBOUND_TOPICS:wms-domain-event,oms-domain-event,purchase-domain-event,supplier-domain-event}
    consumer-group: ${ROCKETMQ_INVENTORY_CONSUMER_GROUP:inventory-domain-event-consumer}
