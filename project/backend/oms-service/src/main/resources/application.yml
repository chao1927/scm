spring:
  application:
    name: oms-service
  profiles:
    active: @spring.profiles.active@
  cloud:
    nacos:
      username: ${NACOS_USERNAME:@nacos.username@}
      password: ${NACOS_PASSWORD:@nacos.password@}
      config:
        server-addr: ${NACOS_SERVER_ADDR:@nacos.server-addr@}
        namespace: ${NACOS_NAMESPACE:@nacos.namespace@}
        group: ${NACOS_GROUP:@nacos.group@}
  flyway:
    enabled: true
  jackson:
    time-zone: Asia/Shanghai
mybatis:
  configuration:
    map-underscore-to-camel-case: true
server:
  port: 8099
scm:
  security:
    active-kid: ${IAM_JWT_ACTIVE_KID:active}
    hmac-secret: ${IAM_JWT_SECRET:}
    previous-kid: ${IAM_JWT_PREVIOUS_KID:}
    previous-hmac-secret: ${IAM_JWT_PREVIOUS_SECRET:}
    previous-valid-until-epoch-second: ${IAM_JWT_PREVIOUS_VALID_UNTIL_EPOCH_SECOND:0}
    permission-namespace: oms
