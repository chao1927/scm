spring:
  config:
    import:
      - "optional:nacos:scm-common-test.yaml?group=${NACOS_GROUP:@nacos.group@}&refreshEnabled=true"
      - "optional:nacos:${spring.application.name}-test.yaml?group=${NACOS_GROUP:@nacos.group@}&refreshEnabled=true"
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/scm_oms?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    hikari:
      maximum-pool-size: ${MYSQL_MAX_POOL_SIZE:10}
      minimum-idle: ${MYSQL_MIN_IDLE:2}
      connection-timeout: ${MYSQL_CONNECTION_TIMEOUT_MS:3000}
scm:
  oms:
    metric-export:
      storage:
        local:
          root: ${java.io.tmpdir}/scm-oms-metric-exports
  rocketmq:
    enabled: ${ROCKETMQ_ENABLED:false}
    endpoints: ${ROCKETMQ_ENDPOINTS:127.0.0.1:8081}
    oms-topic: ${ROCKETMQ_OMS_TOPIC:oms-domain-event}
    external-consumer:
      topics: ${ROCKETMQ_OMS_EXTERNAL_TOPICS:inventory-domain-event,wms-domain-event,tms-domain-event,bms-domain-event}
      group: ${ROCKETMQ_OMS_CONSUMER_GROUP:oms-business-event-consumer}
      threads: ${ROCKETMQ_OMS_CONSUMER_THREADS:2}
    outbox:
      batch-size: ${ROCKETMQ_OMS_OUTBOX_BATCH_SIZE:20}
      fixed-delay-ms: ${ROCKETMQ_OMS_OUTBOX_DELAY_MS:1000}
