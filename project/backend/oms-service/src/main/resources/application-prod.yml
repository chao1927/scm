spring:
  config:
    import:
      - "optional:nacos:scm-common-prod.yaml?group=${NACOS_GROUP:@nacos.group@}&refreshEnabled=true"
      - "optional:nacos:${spring.application.name}-prod.yaml?group=${NACOS_GROUP:@nacos.group@}&refreshEnabled=true"
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://mysql:3306/scm_oms?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:scm_app}
    password: ${MYSQL_PASSWORD:change-me}
    hikari:
      maximum-pool-size: ${MYSQL_MAX_POOL_SIZE:20}
      minimum-idle: ${MYSQL_MIN_IDLE:4}
      connection-timeout: ${MYSQL_CONNECTION_TIMEOUT_MS:3000}
scm:
  oms:
    metric-export:
      storage:
        type: local
        local:
          root: ${OMS_METRIC_EXPORT_STORAGE_ROOT:./data/oms-metric-exports}
  rocketmq:
    enabled: ${SCM_ROCKETMQ_ENABLED:true}
    endpoints: ${SCM_ROCKETMQ_ENDPOINTS:rocketmq:8081}
    oms-topic: ${ROCKETMQ_OMS_TOPIC:oms-domain-event}
    external-consumer:
      topics: ${ROCKETMQ_OMS_EXTERNAL_TOPICS:inventory-domain-event,wms-domain-event,tms-domain-event,bms-domain-event}
      group: ${ROCKETMQ_OMS_CONSUMER_GROUP:oms-business-event-consumer}
      threads: ${ROCKETMQ_OMS_CONSUMER_THREADS:4}
    outbox:
      batch-size: ${ROCKETMQ_OMS_OUTBOX_BATCH_SIZE:50}
      fixed-delay-ms: ${ROCKETMQ_OMS_OUTBOX_DELAY_MS:1000}
