spring:
  config:
    import:
      - "optional:nacos:scm-common-test.yaml?group=${NACOS_GROUP:@nacos.group@}&refreshEnabled=true"
      - "optional:nacos:${spring.application.name}-test.yaml?group=${NACOS_GROUP:@nacos.group@}&refreshEnabled=true"
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/scm_supplier?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    hikari:
      maximum-pool-size: ${MYSQL_MAX_POOL_SIZE:10}
      minimum-idle: ${MYSQL_MIN_IDLE:2}
      connection-timeout: ${MYSQL_CONNECTION_TIMEOUT_MS:3000}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:1}
      timeout: ${REDIS_TIMEOUT:2s}

scm:
  dubbo:
    registry-address: ${DUBBO_REGISTRY_ADDRESS:N/A}
    timeout-ms: ${DUBBO_TIMEOUT_MS:2000}
  rocketmq:
    enabled: ${SCM_ROCKETMQ_ENABLED:false}
    endpoints: ${SCM_ROCKETMQ_ENDPOINTS:127.0.0.1:8081}
    topic: ${ROCKETMQ_SUPPLIER_TOPIC:supplier-domain-event}
    master-data-consumer:
      enabled: ${ROCKETMQ_MASTER_DATA_CONSUMER_ENABLED:false}
      topic: ${ROCKETMQ_MASTER_DATA_TOPIC:master-data-domain-event}
      group: ${ROCKETMQ_MASTER_DATA_CONSUMER_GROUP:supplier-master-data-snapshot}
    contract-approval-consumer:
      enabled: ${ROCKETMQ_CONTRACT_APPROVAL_CONSUMER_ENABLED:false}
      topic: ${ROCKETMQ_CONTRACT_APPROVAL_TOPIC:iam-approval-domain-event}
      group: ${ROCKETMQ_CONTRACT_APPROVAL_CONSUMER_GROUP:supplier-contract-approval}
    business-consumer:
      enabled: ${ROCKETMQ_BUSINESS_CONSUMER_ENABLED:false}
      topics: ${ROCKETMQ_BUSINESS_TOPICS:purchase-domain-event,wms-domain-event,tms-domain-event,bms-domain-event,inventory-domain-event,supplier-operations-event}
      group: ${ROCKETMQ_BUSINESS_CONSUMER_GROUP:supplier-business-event-v1}
      threads: ${ROCKETMQ_BUSINESS_CONSUMER_THREADS:4}
