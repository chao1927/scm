bind 0.0.0.0
protected-mode yes
port 6379

aclfile /usr/local/etc/redis/users.acl

appendonly yes
appendfsync everysec
save 900 1
save 300 10
save 60 10000

dir /data
dbfilename dump.rdb
appenddirname appendonlydir

maxmemory 512mb
maxmemory-policy allkeys-lru

tcp-keepalive 300
timeout 0
loglevel notice
