# Mac IDE 中运行 Spring Boot/Dubbo 服务时的本地配置模板。
# 密码由 middleware-stack/.env 提供，请通过 IDE 环境变量注入。
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:${MYSQL_PORT:3306}/${MYSQL_DATABASE:scm_inventory}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_APP_USER:scm_app}
    password: ${MYSQL_APP_PASSWORD}
  data:
    redis:
      host: 127.0.0.1
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:scm_app}
      password: ${REDIS_PASSWORD}

rocketmq:
  # RocketMQ 5.x 新客户端/项目当前 gRPC 用法应连接 Proxy endpoint。
  endpoints: 127.0.0.1:${ROCKETMQ_PROXY_GRPC_PORT:8081}
  # 仅旧 remoting 客户端使用 NameServer。
  name-server: 127.0.0.1:${ROCKETMQ_NAMESRV_PORT:9876}

dubbo:
  application:
    name: ${DUBBO_APPLICATION_NAME}
    metadata-type: remote
  protocol:
    name: tri
    # 每个 Provider 必须使用不同端口，例如 inventory=50051、wms=50052。
    port: ${DUBBO_PROTOCOL_PORT:50051}
    # Provider 和 Consumer 都在 Mac IDE 运行时注册本机地址。
    host: ${DUBBO_PROTOCOL_HOST:127.0.0.1}
  registry:
    address: nacos://127.0.0.1:${NACOS_API_PORT:8848}
    username: ${NACOS_USERNAME:nacos}
    password: ${NACOS_PASSWORD}
    register-mode: instance
    parameters:
      namespace: ${NACOS_NAMESPACE:public}
      group: ${NACOS_GROUP:DUBBO_GROUP}
  metadata-report:
    address: nacos://127.0.0.1:${NACOS_API_PORT:8848}
    username: ${NACOS_USERNAME:nacos}
    password: ${NACOS_PASSWORD}
