apiVersion: v1
kind: Namespace
metadata:
  name: scm-infra
  labels:
    app.kubernetes.io/part-of: scm
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: scm-infra
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: scm
data:
  redis.conf: |
    bind 0.0.0.0
    protected-mode yes
    port 6379
    tcp-backlog 511
    timeout 0
    tcp-keepalive 300

    daemonize no
    supervised no
    loglevel notice
    databases 16

    dir /data
    dbfilename dump.rdb
    save 900 1
    save 300 10
    save 60 10000

    appendonly yes
    appendfilename "appendonly.aof"
    appenddirname "appendonlydir"
    appendfsync everysec

    aclfile /etc/redis-auth/users.acl

    maxmemory 1gb
    maxmemory-policy allkeys-lru
---
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: scm-infra
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: scm
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: scm-infra
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: scm
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: redis-local-static
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: scm
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: redis-data-pv
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: scm
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: redis-local-static
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - __STORAGE_NODE_NAME__
  local:
    path: /var/lib/k8s-local-storage/redis
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: scm-infra
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: scm
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: redis-local-static
  volumeName: redis-data-pv
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: scm-infra
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: scm
spec:
  serviceName: redis-headless
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: scm
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: __STORAGE_NODE_NAME__
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:8.8.0-alpine
          imagePullPolicy: IfNotPresent
          command:
            - redis-server
          args:
            - /etc/redis/redis.conf
          env:
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            exec:
              command:
                - redis-cli
                - --user
                - scm_app
                - ping
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 2
          readinessProbe:
            exec:
              command:
                - redis-cli
                - --user
                - scm_app
                - ping
            failureThreshold: 3
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            exec:
              command:
                - redis-cli
                - --user
                - scm_app
                - ping
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 2
          volumeMounts:
            - name: config
              mountPath: /etc/redis
              readOnly: true
            - name: data
              mountPath: /data
            - name: auth
              mountPath: /etc/redis-auth
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: redis-config
            defaultMode: 0444
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
        - name: auth
          secret:
            secretName: redis-auth
            defaultMode: 0440
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
